<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save post as PDF — Crossbirds</title>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
  <script src="render.js"></script>
  <style>
    @page { size:auto; margin:18mm 0; }
    body { background:#fff; }
    body::before { display:none; }
    main { width:min(100%, var(--post-width, 720px)); padding:0 0 32px; }
    .pdf-actions { display:flex; align-items:center; justify-content:space-between; gap:16px;
      max-width:720px; margin:24px auto; padding:13px 16px; border-radius:10px; background:#eaf6f4; }
    .pdf-actions p { margin:0; font:14px/1.4 'Cabin', sans-serif; color:var(--dim); }
    .pdf-actions button { border:0; border-radius:8px; padding:8px 13px; cursor:pointer; background:var(--ink); color:var(--white); font:600 14px 'Cabin', sans-serif; white-space:nowrap; }
    .pdf-block { break-inside:avoid-page; page-break-inside:avoid; }
    .pdf-block > * { break-inside:avoid-page; page-break-inside:avoid; }
    @media print {
      html, body { margin:0; padding:0; background:#fff; }
      body { font-size:11pt; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .pdf-actions { display:none; }
      /* The page rule gives every page vertical space; this physical inset
         keeps left and right whitespace even with browser margins disabled. */
      main { width:100%; max-width:none; margin:0; padding:0 15mm; }
      .post-head { padding-top:0; }
      .pdf-block { break-inside:avoid-page; page-break-inside:avoid; }
    }
  </style>
</head>
<body>
  <div class="pdf-actions" id="pdf-actions">
    <p>Blocks stay together between pages when they fit. Choose <strong>Save as PDF</strong> in the next dialog.</p>
    <button id="print">Save as PDF</button>
  </div>
  <main><div id="view"><p class="muted">Preparing post…</p></div></main>
  <script>
    const { renderBlock, hydrate, esc, prettyDate } = window.FieldNotes;
    const view = document.getElementById('view');

    function paint(post) {
      const width = Number.isFinite(+post.width) ? Math.min(1200, Math.max(480, +post.width)) : 720;
      document.documentElement.style.setProperty('--post-width', `${width}px`);
      document.title = `${post.title || 'Post'} — PDF`;
      view.innerHTML = `
        <article class="post">
          <header class="post-head">
            <time>${esc(prettyDate(post.date))}</time>
            <h1>${esc(post.title || 'Untitled')}</h1>
          </header>
          ${(post.blocks || []).map(block => `<section class="pdf-block">${renderBlock(block)}</section>`).join('') || '<p class="muted">No blocks yet.</p>'}
        </article>`;
      view.querySelectorAll('img').forEach(img => { img.loading = 'eager'; });
      hydrate(view, { onImage: src => window.open(src, '_blank') });
    }

    addEventListener('message', e => {
      if (e.origin !== location.origin || e.data?.kind !== 'pdf-post') return;
      paint(e.data.post);
    });
    document.getElementById('print').addEventListener('click', () => window.print());
    opener?.postMessage({ kind:'pdf-ready' }, location.origin);
  </script>
</body>
</html>
