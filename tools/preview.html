<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/">
  <title>Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
  <script src="render.js"></script>
  <style>
    main { padding-top:8px; width:min(100% - 36px, 720px); }
    body { background:var(--sky); }
  </style>
</head>
<body>
  <main><div id="view"></div></main>
<script>
/* Driven by the editor over postMessage. Same renderer and stylesheet
   as the published page, so what shows here is what ships. */
const { renderBlocks, hydrate, esc, prettyDate } = window.FieldNotes;
const view = document.getElementById('view');

function paint({ title, date, blocks }) {
  view.innerHTML = `
    <article class="post">
      <header class="post-head">
        <time>${esc(prettyDate(date))}</time>
        <h1>${esc(title || 'Untitled')}</h1>
      </header>
      ${blocks && blocks.length ? renderBlocks(blocks)
        : '<p class="muted">No blocks yet.</p>'}
    </article>`;
  hydrate(view, { onImage: src => window.open(src, '_blank') });
}

addEventListener('message', e => {
  if (e.data && e.data.kind === 'render') {
    const y = scrollY;
    paint(e.data);
    scrollTo(0, y);
  }
});

paint({ title: '', date: new Date().toISOString().slice(0, 10), blocks: [] });
parent.postMessage({ kind: 'preview-ready' }, '*');
</script>
</body>
</html>
